# =========================================================
# BT Navigator
# =========================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10.0
    default_server_timeout: 20.0


# =========================================================
# Planner Server
# =========================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


# =========================================================
# Controller Server (DWB)
# =========================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Velocidades (permiten retroceder)
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_theta: -1.2
      max_vel_theta: 1.2

      # Aceleraciones suaves (caster estable)
      acc_lim_x: 0.25
      acc_lim_theta: 0.8
      decel_lim_x: -0.25
      decel_lim_theta: -0.8

      vx_samples: 20
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 1.0


# =========================================================
# Local Costmap  (SIN voxel_layer)
# =========================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      width: 3.0
      height: 3.0
      resolution: 0.05

      update_frequency: 10.0
      publish_frequency: 5.0
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      # Blindaje contra defaults heredados
      voxel_layer:
        enabled: false
        height: 10.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: oak_points

        oak_points:
          topic: /stereo/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 10.0


# =========================================================
# Global Costmap  (SIN voxel_layer)
# =========================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link

      width: 10.0
      height: 10.0
      resolution: 0.05

      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      # Blindaje contra defaults heredados
      voxel_layer:
        enabled: false
        height: 10.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: oak_points

        oak_points:
          topic: /stereo/points
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 10.0


# =========================================================
# Lifecycle Manager
# =========================================================
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      [
        "controller_server",
        "planner_server",
        "bt_navigator",
        "local_costmap",
        "global_costmap"
      ]

